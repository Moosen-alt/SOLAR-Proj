<!doctype html><html><head>
<!-- Built from a production capture (City of Tigard OR, Tyler Portico = Okta Identity Engine
     sign-in widget 7.49, 2026-09-27, run sw6s page-login-no_credential): styles/classes/scripts and
     the social icons' image data stripped, structure and attributes kept. The IDENTIFIER step. -->
<meta charset="utf-8">
<title>Tyler Portico Citizen | Sign in to community access services.</title>
<style>.hide{display:none} body{font-family:Roboto,sans-serif}</style>
</head>
<body>
<div>
<div id="okta-login-container" translate="no"><div><div><main id="okta-sign-in" data-se="auth-container main-container" lang="en" dir="ltr"><div><div><div>
<div data-se="okta-sign-in-header auth-header "><h1 role="presentation" tabindex="-1"><img alt="Tyler Portico Citizen logo" data-se="auth-org-logo" width="40" height="40" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></h1></div>
<div><form novalidate="" data-se="o-form" aria-live="polite"><div>
<div><div><h1 data-se="o-form-head" tabindex="-1">Sign in to community access services.</h1></div></div>
<div><div><label data-shrink="false" for="identifier" id="identifier-label"><span>Email address</span></label><div required="true"><input aria-invalid="false" autocomplete="username" id="identifier" name="identifier" required="" type="text" aria-labelledby="identifier-label" data-se="identifier"></div></div></div>
<div><fieldset><legend class="hide"> </legend><div aria-labelledby="rememberMe-label" id="rememberMe"><label id="rememberMe-checkbox"><span><input type="checkbox" name="rememberMe" data-se="rememberMe"></span><span><span tabindex="-1">Keep me signed in</span></span></label></div></fieldset></div>
<div><button tabindex="0" type="submit" data-se="save">Next</button></div>
<div><div role="presentation" data-se="separation-line"><span>OR</span></div></div>
<div id="SocialSignins"><div id="SocialSigninsGroup">
<div><button tabindex="0" type="button" data-se="piv-card-button social-auth-google-button"><span></span>Sign in with Google</button></div>
<div><button tabindex="0" type="button" data-se="piv-card-button social-auth-apple-button"><span></span>Sign in with Apple</button></div>
<div><button tabindex="0" type="button" data-se="piv-card-button social-auth-microsoft-button"><span></span>Sign in with Microsoft</button></div>
<div><button tabindex="0" type="button" data-se="piv-card-button social-auth-facebook-button"><span></span>Sign in with Facebook</button></div>
</div></div>
<div><button role="link" type="button" data-se="unlock">Unlock account?</button></div>
<div><a aria-label="Help Opens in a new tab" data-se="help" href="https://help.portico-example.test/help/login" target="_blank">Help</a></div>
<div><div><p data-se="signup-info" tabindex="-1" class="hide">Create an account</p></div><div><button role="link" type="button" data-se="enroll">Create an account</button></div></div>
</div></form></div>
</div></div></div></main></div></div></div>
<div id="inactive-tab-main-div" class="hide"><h2>The page has timed out</h2></div>
</div>
<iframe id="account-chooser-iframe" data-se="account-chooser" class="hide" src="https://login.okta.com/discovery/iframe.html"></iframe>
</body></html>
