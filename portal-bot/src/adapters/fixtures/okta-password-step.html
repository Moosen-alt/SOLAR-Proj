<!doctype html><html><head>
<!-- Built from a production capture (City of Tigard OR, Tyler Portico = Okta Identity Engine
     sign-in widget 7.49 on identity.tylerportico.com, 2026-09-27, run q3zu page-login-mfa_captcha):
     styles/classes/scripts stripped, structure and attributes kept, the account's email replaced by
     {{IDENTIFIER}} (the smoke fills in a fake one). The remembered-account PASSWORD step. -->
<meta charset="utf-8">
<title>Tyler Portico Citizen | Verify with your password</title>
<style>.hide{display:none} body{font-family:Roboto,sans-serif}</style>
</head>
<body>
<div>
<div id="okta-login-container" translate="no"><div><div><main id="okta-sign-in" data-se="auth-container main-container" lang="en" dir="ltr"><div><div><div>
<div data-se="okta-sign-in-header auth-header authCoinSpacing"><h1 role="presentation" tabindex="-1"><img alt="Tyler Portico Citizen logo" data-se="auth-org-logo" width="40" height="40" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></h1><div data-se="factor-beacon mfa-okta-password " aria-hidden="true" class="hide"></div></div>
<div><form novalidate="" data-se="o-form" aria-live="polite"><div>
<div id="SocialSignins" hidden=""><div id="SocialSigninsGroup"></div></div>
<div><div title="{{IDENTIFIER}}" data-se="identifier-container"><div data-se="identifier" translate="no"><span>{{IDENTIFIER}}</span></div></div></div>
<div><div><h1 data-se="o-form-head" tabindex="-1">Verify with your password</h1></div></div>
<div class="hide"><input type="text" id="username" name="username"></div>
<div><div><label data-shrink="false" for="credentials.passcode" id="credentials.passcode-label"><span>Password</span></label><div required="true"><input aria-invalid="false" autocomplete="current-password" id="credentials.passcode" name="credentials.passcode" required="" type="password" aria-labelledby="credentials.passcode-label" data-se="credentials.passcode" role="textbox"><div><button tabindex="0" type="button" aria-controls="credentials.passcode" aria-label="Show password" aria-pressed="false">&#128065;</button></div></div></div></div>
<div><button tabindex="0" type="submit" data-se="save">Verify</button></div>
<div><button role="link" type="button" data-se="forgot-password">Forgot password?</button></div>
<div><button role="link" type="button" data-se="switchAuthenticator">Verify with something else</button></div>
<div><button role="link" type="button" data-se="cancel">Back to sign in</button></div>
</div></form></div>
</div></div></div></main></div></div></div>
<div id="inactive-tab-main-div" class="hide"><h2>The page has timed out</h2><p>If this page does not reload automatically, please refresh your browser.</p></div>
<div hidden=""><div id="PasswordResetEmailSent"><p>Your password reset email will come from Community Access.</p></div></div>
</div>
<iframe id="account-chooser-iframe" data-se="account-chooser" class="hide" src="https://login.okta.com/discovery/iframe.html"></iframe>
</body></html>
