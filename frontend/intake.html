<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project details · Solar Submission Autopilot</title>
  <link rel="stylesheet" href="/styles.css" />
  <!-- Manrope. Unlike the vendored lucide above, a webfont degrades gracefully:
       if fonts.googleapis.com is unreachable (offline demo, locked-down cloud)
       the page falls back to the system stack in --font-sans and every layout
       still holds. Icons would simply vanish, which is why THOSE are vendored. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .intake-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .intake-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); width: min(440px, 100%); padding: 28px; }
    .intake-card h1 { font-size: var(--text-xl); margin-bottom: 4px; }
    .intake-card p.muted { margin-bottom: 18px; font-size: var(--text-sm); }
    .intake-card .project-label { font-weight: 700; margin-bottom: 18px; padding: 10px 12px; background: var(--surface-2); border-radius: var(--radius-md); font-size: var(--text-sm); }
    .intake-card label { display: block; font-size: var(--text-sm); font-weight: 700; margin: 14px 0 4px; }
    .intake-card input, .intake-card select { width: 100%; padding: 9px 11px; border: 1px solid var(--input); border-radius: var(--radius-sm); font: inherit; background: var(--surface); color: var(--text); }
    .portal-q-head { margin: 20px 0 2px; font-size: var(--text-sm); font-weight: 700; }
    .portal-q-sub { font-size: var(--text-xs); color: var(--muted); margin-bottom: 4px; }
    .intake-card button { width: 100%; justify-content: center; margin-top: 20px; }
    .field-hint { font-weight: 400; font-size: var(--text-xs); color: var(--muted); }
    #intakeMsg { font-size: var(--text-sm); margin-top: 14px; min-height: 18px; }
    #intakeMsg.error { color: var(--danger); }
    #intakeMsg.ok { color: var(--success); }
  </style>
</head>
<body>
  <div class="intake-wrap">
    <form class="intake-card" id="intakeForm">
      <h1>Project details needed</h1>
      <p class="muted">Your permit coordinator needs a few details to submit this solar permit. Please fill in what you can.</p>
      <div class="project-label" id="projectLabel">Loading…</div>
      <div id="fields"></div>
      <button type="submit" class="primary" id="submitBtn" disabled>Submit details</button>
      <div id="intakeMsg"></div>
    </form>
  </div>
  <script>
    const token = new URLSearchParams(location.search).get("token");
    const msg = document.getElementById("intakeMsg");
    const fieldsEl = document.getElementById("fields");
    const submitBtn = document.getElementById("submitBtn");

    function setMsg(text, kind) { msg.textContent = text; msg.className = kind || ""; }

    const TYPE = { jobValue: "text", homeownerEmail: "email", homeownerPhone: "tel" };
    const HINT = {
      jobValue: "The total contract / installed price for this project (used for the permit fee).",
      homeownerEmail: "",
      homeownerPhone: "",
    };

    async function load() {
      if (!token) { setMsg("This link is missing its token. Ask your coordinator for a new one.", "error"); return; }
      try {
        const res = await fetch("/api/intake/" + encodeURIComponent(token));
        const data = await res.json();
        if (!res.ok) { setMsg(data.error || "This link is no longer valid.", "error"); return; }
        document.getElementById("projectLabel").textContent = data.projectLabel;
        if (data.status === "completed") setMsg("These details were already submitted. You can update them below if needed.", "ok");
        fieldsEl.innerHTML = "";
        for (const f of data.fields) {
          const id = "fld_" + f.key;
          const label = document.createElement("label");
          label.setAttribute("for", id);
          label.textContent = f.label;
          if (HINT[f.key]) {
            const hint = document.createElement("span");
            hint.className = "field-hint";
            hint.textContent = " — " + HINT[f.key];
            label.appendChild(hint);
          }
          const input = document.createElement("input");
          input.id = id;
          input.name = f.key;
          input.type = TYPE[f.key] || "text";
          // Convenience only — the server enforces this. A browser that ignores
          // `required` (or a hand-rolled POST) still gets a 400 naming the gap.
          if (f.required) input.required = true;
          if (f.value) input.value = f.value;
          fieldsEl.appendChild(label);
          fieldsEl.appendChild(input);
        }
        // Portal per-job questions: the utility/permit portal asks these about
        // THIS job and the documents don't answer them. Choices are rigid — the
        // portal's own options exactly — plus "I'm not sure", which flags the
        // question for the coordinator instead of guessing.
        const questions = data.questions || [];
        if (questions.length) {
          const head = document.createElement("div");
          head.className = "portal-q-head";
          head.textContent = "Questions the permitting/utility portal will ask";
          const sub = document.createElement("div");
          sub.className = "portal-q-sub";
          sub.textContent = "Pick exactly the option that applies to this job. Not sure? Choose “I’m not sure” and your coordinator will follow up.";
          fieldsEl.appendChild(head);
          fieldsEl.appendChild(sub);
        }
        for (const q of questions) {
          const id = "q_" + q.key;
          const label = document.createElement("label");
          label.setAttribute("for", id);
          label.textContent = q.label;
          const select = document.createElement("select");
          select.id = id;
          select.name = q.key;
          select.dataset.portalQuestion = "1";
          if (q.required) select.required = true;
          const blank = document.createElement("option");
          blank.value = "";
          blank.textContent = "— choose —";
          select.appendChild(blank);
          for (const opt of q.options || []) {
            const o = document.createElement("option");
            o.value = opt;
            o.textContent = opt;
            select.appendChild(o);
          }
          const unsure = document.createElement("option");
          unsure.value = "__unsure__";
          unsure.textContent = "I’m not sure — ask my coordinator";
          select.appendChild(unsure);
          // "I'm not sure" is an ANSWER, so it must come back selected — otherwise
          // reopening the link to fix a typo re-asks a question already answered.
          if (q.value === "__unsure__") select.value = "__unsure__";
          else if (q.value && (q.options || []).includes(q.value)) select.value = q.value;
          fieldsEl.appendChild(label);
          fieldsEl.appendChild(select);
        }
        submitBtn.disabled = false;
      } catch (e) {
        setMsg("Network error: " + e.message, "error");
      }
    }

    document.getElementById("intakeForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      setMsg("");
      const controls = Array.from(fieldsEl.querySelectorAll("input, select"));
      // PREFLIGHT BEFORE THE BUTTON IS DISABLED. Bailing after disabling it would
      // strand the client on a dead form with no way to submit the fix.
      const firstEmpty = controls.find((c) => c.required && !c.value.trim());
      if (firstEmpty) {
        setMsg("Please answer every question on this form before submitting.", "error");
        firstEmpty.focus();
        return;
      }
      submitBtn.disabled = true;
      const payload = {};
      // Send EVERY control the form asked, empty ones included: dropping blanks
      // made "skipped" and "never asked" identical on the wire.
      for (const input of controls) payload[input.name] = input.value.trim();
      try {
        const res = await fetch("/api/intake/" + encodeURIComponent(token), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (res.ok) {
          setMsg("Thank you — your details were submitted. You can close this page.", "ok");
        } else {
          setMsg(data.error || "Submission failed.", "error");
          submitBtn.disabled = false;
        }
      } catch (e2) {
        setMsg("Network error: " + e2.message, "error");
        submitBtn.disabled = false;
      }
    });

    load();
  </script>
</body>
</html>
