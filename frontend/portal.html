<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="/assets/brand/keel-symbol-64.png" />
  <link rel="apple-touch-icon" href="/assets/brand/keel-symbol-180.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The token is in the URL, so keep this page out of indexes and out of Referer headers.
       status.html and intake.html now carry both too. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Your projects · Keelix Automation</title>
  <style>
    /* Manrope, VENDORED (frontend/vendor), the same two faces styles.css declares — copied, not
       linked, because this page keeps its independence from styles.css (see below). A logged-out
       visitor can load /vendor/<file> since PUBLIC_STATIC_ASSET opened it in backend/src/auth.ts;
       before that the request 302'd to /login and this page leaned on Google Fonts. Now it makes
       no external request, and the --font-sans fallback still holds every layout offline. */
    @font-face {
      font-family: "Manrope"; font-style: normal; font-weight: 200 800; font-display: swap;
      src: url("/vendor/manrope-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: "Manrope"; font-style: normal; font-weight: 200 800; font-display: swap;
      src: url("/vendor/manrope-latin-ext.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    /* Matched to status.html deliberately — this is its sibling, and a client who follows a
       link from an update email to here should not feel handed to a different product. */
    /* PALETTE MATCHED BY VALUE to frontend/styles.css — not by reference, so these
       are hand-kept in step with the :root there. Same oklch values, same names.

       This page links no stylesheet on purpose. The old reason given here — that a
       sibling .css would bounce a logged-out client to /login — is only half true:
       /styles.css is one of the exempt `openPaths` in backend/src/auth.ts, so it
       alone would load, and so do /vendor/ and /assets/brand/ files. The reason that still holds is
       independence: styles.css is a large shared surface under concurrent edit, and a
       tokenized page a customer opens from an email must not restyle itself because
       the operator dashboard changed.

       THE LOOK IS THE MARKETING SITE'S, deliberately: this page is the company's
       face to the client, so it carries the site's structure — the wordmark, a
       green uppercase eyebrow over every section, a confident sentence-case
       heading, a dark full-bleed band under the header, hairline cards and pill
       chips on warm paper. Nothing about the data or the wording changed. */
    :root {
      color-scheme: light;
      --bg:        oklch(98.5% .004 95);   /* warm paper, not white */
      --surface:   oklch(100% 0 0);
      --surface-2: oklch(95.5% .009 180);
      --text:      oklch(20.5% .025 220);
      --muted:     oklch(52% .025 220);
      --line:      oklch(88% .012 220);
      --primary:   oklch(42% .105 173);
      --accent:    oklch(91% .07 153);     /* light green tint — positive chips */
      --success:   oklch(50% .13 150);
      --warning:   oklch(52% .12 75);
      --danger:    oklch(57.7% .245 27.325);
      /* The site's dark band: near-black teal. Same value as the app's dark
         --background, used here in light mode as a full-bleed section fill. */
      --ink:          oklch(20.5% .025 220);
      --ink-text:     oklch(96% .005 220);
      --ink-muted:    oklch(72% .02 220);
      --ink-line:     oklch(36% .02 220);
      --ink-primary:  oklch(70% .105 173); /* the eyebrow green, legible on ink */
      --radius-sm: calc(.45rem - 2px);     /* ~5.2px — the site's card radius */
      --radius-md: .45rem;
      --radius-lg: calc(.45rem + 4px);
      --font-sans: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --shadow-sm: 0 1px 2px rgba(24, 35, 48, .05);
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background: var(--bg); margin: 0; color: var(--text);
      line-height: 1.55; font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- Brand bar. Static, outside #app, so the mark is there while loading
            and still there if the link has expired. ---------------------------- */
    .topbar { border-bottom: 1px solid var(--line); background: var(--bg); }
    .topbar .inner { max-width: 760px; margin: 0 auto; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .mark { display: flex; align-items: center; gap: 9px; }
    .mark svg { display: block; flex: none; }
    .mark .name { font-size: 15px; font-weight: 800; letter-spacing: .07em; line-height: 1; }
    .mark .sub { font-size: 8px; font-weight: 700; letter-spacing: .2em; color: var(--muted); line-height: 1; margin-top: 3px; }
    .topbar .kicker { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

    /* ---- Full-bleed bands. #app is full width; each band centres its own inner. */
    .band { width: 100%; }
    .band .inner { max-width: 760px; margin: 0 auto; padding: 0 20px; }
    .band-ink { background: var(--ink); color: var(--ink-text); }
    .band-ink .inner { padding-top: 44px; padding-bottom: 44px; }
    .band-paper .inner { padding-top: 40px; padding-bottom: 56px; }

    /* ---- The site's section signature: green uppercase eyebrow, then a large
            sentence-case heading that ends in a period. ------------------------ */
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--primary); margin: 0 0 12px; }
    .band-ink .eyebrow { color: var(--ink-primary); }
    h1 { font-size: clamp(26px, 6.4vw, 34px); font-weight: 600; letter-spacing: -.02em; line-height: 1.16; margin: 0 0 10px; }
    h2 { font-size: clamp(19px, 3.4vw, 23px); font-weight: 600; letter-spacing: -.015em; line-height: 1.25; margin: 0 0 18px; }
    .lede { color: var(--ink-muted); font-size: 14px; margin: 0; }
    /* The one number on this page a client acts on, so it gets the site's
       positive-chip treatment instead of another grey sentence. */
    .needs-you { display: inline-block; margin-top: 18px; padding: 5px 13px; border-radius: 999px; background: color-mix(in oklab, var(--ink-primary) 22%, transparent); color: var(--ink-primary); font-size: 13px; font-weight: 700; }

    /* ---- Hairline cards, restrained shadow, the site's ~5.2px radius. -------- */
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); overflow: hidden; margin-bottom: 18px; }
    .card:last-of-type { margin-bottom: 0; }
    .card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 16px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .card-head .what { flex: 1 1 250px; min-width: 0; }
    .card-body { padding: 2px 18px 4px; }
    h3 { font-size: 16px; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; margin: 0 0 2px; }
    .muted { color: var(--muted); font-size: 13px; }

    /* Rows wrap rather than clip: a status label can be a whole sentence
       ("Waiting on us — reading the jurisdiction's latest update") and it has to
       survive a 360px phone intact. flex-shrink is 1 on the chip for the same
       reason — at 0 the longest label ran off the right edge of the card. */
    .track { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 16px; padding: 14px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .track:first-child { border-top: 0; }
    .track .what { flex: 1 1 250px; min-width: 0; }
    .track .name { font-size: 14px; font-weight: 600; letter-spacing: -.005em; }

    /* The neutral chip is an OUTLINE, like the site's own "Plan review" pill.
       It used to be green-on-tint, which made "Waiting on us — reading the
       utility's latest update" look like good news. Green is now reserved for
       the states that actually are. */
    .badge { flex: 0 1 auto; max-width: 100%; align-self: flex-start; font-size: 12px; font-weight: 700; line-height: 1.4; padding: 4px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
    .badge.good { background: var(--accent); border-color: transparent; color: oklch(32% .08 160); }
    .badge.warn { background: color-mix(in oklab, var(--warning) 18%, var(--surface)); border-color: transparent; color: oklch(38% .12 68); }
    /* "Your move" is the SOLID green chip — the site's own CTA colour. It used to be a
       danger-red tint, which put "Permit ready for issue" (good news, one action away)
       in the colour a client reads as "something is wrong". Red now says nothing here,
       amber stays the problem colour for corrections, pale green stays "done", and the
       outline pill stays "nothing needed from anyone yet". Four states, four readings. */
    .badge.you { background: var(--primary); border-color: transparent; color: oklch(98.4% .003 247.858); }

    /* Same meaning, same look as status.html's: a reading taken before our current status rules
       landed, shown with its caveat rather than published as today's fact. Styled as a soft chip
       so a client reads it as a note beside the status, not as an error, and given its own
       full-width row so it lands UNDER the status it qualifies rather than above it — the caveat
       has to follow the claim to read as one. */
    .recheck-row { flex: 1 1 100%; margin-top: 2px; }
    .recheck { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px; background: color-mix(in oklab, var(--warning) 12%, var(--surface)); color: oklch(38% .12 68); font-size: 12px; font-weight: 500; }
    .recheck::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: var(--warning); flex: none; }
    /* THE THIRD ANSWER, same look as status.html's: our own check did not run, so we know nothing
       about this reading either way. Not the warning colour — amber says "something is wrong with
       this filing", and nothing is known to be wrong with it. A grey gap in OUR knowledge, shown
       as one. Absent is the one thing it must never be. */
    .recheck.unknown { background: var(--surface-2); color: var(--muted); }
    .recheck.unknown::before { background: transparent; border: 1.5px solid var(--muted); }

    /* The updates strip sits on the quiet surface at the foot of the card — the
       same move the site's mock card makes with its tinted "Recommended action" box. */
    .updates { background: var(--surface-2); border-top: 1px solid var(--line); padding: 4px 18px 14px; }
    .updates .head { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 13px 0 2px; }
    .upd { padding: 9px 0 0; font-size: 13px; line-height: 1.55; }
    .upd .when { color: var(--muted); font-size: 12px; font-weight: 500; display: block; margin-bottom: 2px; }

    .empty { padding: 16px 0; color: var(--muted); font-size: 13px; }
    .err { max-width: 760px; margin: 0 auto; text-align: center; padding: 72px 24px; color: var(--muted); font-size: 15px; }
    footer { border-top: 1px solid var(--line); margin-top: 28px; padding-top: 20px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="inner">
      <div class="mark">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 21.5v-6.6" fill="none" stroke="oklch(42% .105 173)" stroke-width="2.1" stroke-linecap="round"/>
          <path d="M12 15.1C12 10.7 9 7.1 4.6 6.2 4 10.7 7.2 14.5 12 15.1Z" fill="oklch(42% .105 173)"/>
          <path d="M12 15.1C12 10.7 15 7.1 19.4 6.2 20 10.7 16.8 14.5 12 15.1Z" fill="oklch(42% .105 173)" opacity=".62"/>
        </svg>
        <div>
          <div class="name">KEELIX</div>
          <div class="sub">AUTOMATION</div>
        </div>
      </div>
      <div class="kicker">Project tracker</div>
    </div>
  </header>
  <main id="app"><div class="err">Loading your projects…</div></main>
  <script>
    // Read-only per-client tracker. One stable link lists every job we are filing for this
    // company. The payload is sanitized server-side (backend/src/clientPortal.ts): addresses,
    // status labels and application/permit numbers only — never correction text, never another
    // company's work, never anything internal.

    // "Filed" is the date the JURISDICTION received it, not the date we staged it. A track with no
    // filing date has not been submitted — automation never presses final submit, so a fully
    // prepared application still reads "Not filed yet" until a person files it.

    // Statuses where the CLIENT is the one who has to do something. Called out separately
    // because a tracker that shows twenty rows all saying "in progress" is a list, not a signal.
    const NEEDS_YOU = new Set(["waiting_on_designer", "ready_for_issue"]);
    const DONE = new Set(["issued", "nem_approved", "handoff_ready", "approved"]);
    const WARN = new Set(["correction_received", "correction_triaged", "qc_failed", "blocked"]);

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const when = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "—";
    const cls = (key) => NEEDS_YOU.has(key) ? "you" : DONE.has(key) ? "good" : WARN.has(key) ? "warn" : "";

    async function load() {
      const app = document.getElementById("app");
      const token = new URLSearchParams(location.search).get("token") || "";
      try {
        const res = await fetch(`/api/public/portal/${encodeURIComponent(token)}`);
        if (!res.ok) throw new Error("not found");
        const d = await res.json();
        const projects = d.projects || [];
        const yours = projects.filter((p) => NEEDS_YOU.has(p.statusKey)).length;

        // A badge is a stored READING, and a reading is one of THREE things — never two.
        //
        //   current    — we checked it, and our rules today agree with what we recorded.
        //   stale      — we checked it, and our rules now read that same text differently. Shown
        //                with a caveat and re-checked, never republished as today's fact.
        //   unverified — OUR CHECK DID NOT RUN AT ALL, so we do not know which of the two it is.
        //
        // The third value is the whole reason this reads `t.reading` instead of a boolean. One
        // `false` stood for two different facts, and this page published the flattering one: the
        // day the drift pass broke, a permit stalled at the counter since Sep 3 went back to an
        // unqualified "In review by the jurisdiction", identical to a filing we had just
        // confirmed. A check that did not happen is not a clean bill of health.
        //
        // Wording names no reviewer: one line serves permits and interconnections. Plain words, no
        // jargon: a client has to be able to read it.
        const READING_NOTE = {
          stale: "Being re-checked — this reading needs confirming",
          unverified: "We could not confirm this is up to date — it may have changed since we last checked",
        };
        // An unrecognised value reads as UNVERIFIED, never as current — the only direction a page
        // is allowed to guess in is the cautious one. A payload with no `reading` at all falls back
        // to the older boolean, which now means "do not publish this as today's fact".
        const readingOf = (row) => {
          const r = row && row.reading;
          if (r === "current" || r === "stale" || r === "unverified") return r;
          if (r) return "unverified";
          return row && row.needsRecheck ? "stale" : "current";
        };
        // `claim` is the sentence the caveat qualifies — a filing with no reading at all shows
        // "Checking…", which asserts nothing, so there is nothing to walk back.
        const readingNote = (row, claim) => {
          const state = readingOf(row);
          if (state === "current" || !claim) return "";
          return `<div class="recheck-row"><span class="recheck${state === "unverified" ? " unknown" : ""}">${esc(READING_NOTE[state])}</span></div>`;
        };
        const cards = projects.map((p) => {
          const tracks = (p.tracks || []).map((t) => `
            <div class="track">
              <div class="what">
                <div class="name">${esc(t.label)}</div>
                <div class="muted">${t.submittedAt ? "Filed " + when(t.submittedAt) : "Not filed yet"}${t.applicationNumber ? " · " + esc(t.applicationNumber) : ""}${t.confirmationNumber ? " · receipt " + esc(t.confirmationNumber) : ""}</div>
                <div class="muted">${t.permitNumber && t.permitNumber !== t.applicationNumber ? "Permit " + esc(t.permitNumber) + " · " : ""}last checked ${when(t.lastCheckedAt)}</div>
              </div>
              <span class="badge ${cls(t.outcome)}">${esc(t.statusLabel || t.outcome || "Checking…")}</span>
              ${readingNote(t, t.statusLabel || t.outcome)}
            </div>`).join("")
            || `<div class="empty">Tracking starts once the application is filed.</div>`;
          // The latest few updates, in the words we actually sent them. Same sentences as the
          // email for the same event — one source, two channels (backend/src/clientUpdates.ts).
          // Capped so a long-running job does not bury the current status under its own history.
          const updates = (p.updates || []).slice(0, 4).map((u) => `
            <div class="upd"><span class="when">${when(u.at)}</span>${esc(u.body)}</div>`).join("");
          return `
            <div class="card">
              <div class="card-head">
                <div class="what">
                  <h3>${esc(p.address)}</h3>
                  <div class="muted">${esc(p.ahj || "")}${p.ahj && p.utility ? " · " : ""}${esc(p.utility || "")}</div>
                </div>
                <span class="badge ${cls(p.statusKey)}">${esc(p.status)}</span>
              </div>
              <div class="card-body">${tracks}</div>
              ${updates ? `<div class="updates"><div class="head">Latest updates</div>${updates}</div>` : ""}
            </div>`;
        }).join("") || `<div class="card"><div class="card-body"><div class="empty">No projects yet. They appear here as soon as we open one.</div></div></div>`;

        app.innerHTML = `
          <div class="band band-ink">
            <div class="inner">
              <p class="eyebrow">Permitting &amp; interconnection</p>
              <h1>${esc(d.company || "Your projects")}</h1>
              <p class="lede">${projects.length} project${projects.length === 1 ? "" : "s"} tracked here. Updated automatically as each one moves.</p>
              ${yours ? `<div class="needs-you">${yours} need${yours === 1 ? "s" : ""} something from you</div>` : ""}
            </div>
          </div>
          <div class="band band-paper">
            <div class="inner">
              <p class="eyebrow">Your projects</p>
              <h2>Every filing we are running for you, in one place.</h2>
              ${cards}
              <footer>Updated automatically as your permits and interconnections move.<br>Bookmark this page — the link does not expire.</footer>
            </div>
          </div>`;
      } catch {
        app.innerHTML = `<div class="err">This tracking link isn't valid. Please contact your permitting team for a new one.</div>`;
      }
    }
    load();
  </script>
</body>
</html>
