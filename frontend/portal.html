<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The token is in the URL, so keep this page out of indexes and out of Referer headers.
       status.html and intake.html are missing both and should get them too. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Your Projects</title>
  <style>
    /* Matched to status.html deliberately — this is its sibling, and a client who follows a
       link from an update email to here should not feel handed to a different product.
       Inline because express.static sits behind requireAuth: a sibling .js or .css would
       redirect a logged-out visitor to /login, which is the exact bug this page must not have. */
    /* PALETTE MATCHED BY VALUE to frontend/styles.css — not by reference.
       This page links no stylesheet on purpose (express.static sits behind
       requireAuth, so a sibling .css would bounce a logged-out client to
       /login), so these are hand-kept in step with the :root there. Same oklch
       values, same names. Font stays the system stack: this is a client-facing
       page that must render instantly with zero external requests. */
    :root {
      color-scheme: light;
      --bg:        oklch(98.5% .004 95);
      --surface:   oklch(100% 0 0);
      --surface-2: oklch(95.5% .009 180);
      --text:      oklch(20.5% .025 220);
      --muted:     oklch(52% .025 220);
      --line:      oklch(88% .012 220);
      --primary:   oklch(42% .105 173);
      --success:   oklch(50% .13 150);
      --warning:   oklch(52% .12 75);
      --danger:    oklch(57.7% .245 27.325);
      --radius-md: .45rem;
      --radius-lg: calc(.45rem + 4px);
    }
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; color: var(--text); line-height: 1.5; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .head { margin-bottom: 20px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 15px; margin: 0 0 2px; }
    .muted { color: var(--muted); font-size: 13px; }
    .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .track { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--primary); white-space: nowrap; }
    .badge.good { background: color-mix(in oklab, var(--success) 14%, var(--surface)); color: var(--success); }
    .badge.warn { background: color-mix(in oklab, var(--warning) 16%, var(--surface)); color: var(--warning); }
    .badge.you { background: color-mix(in oklab, var(--danger) 12%, var(--surface)); color: var(--danger); }
    .upd { border-top: 1px solid var(--line); padding: 10px 0 2px; font-size: 13px; line-height: 1.5; }
    .upd .when { color: var(--muted); font-size: 12px; display: block; margin-bottom: 2px; }
    .err { text-align: center; padding: 48px 16px; color: var(--muted); }
    footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 24px; }
  </style>
</head>
<body>
  <div class="wrap" id="app"><div class="err">Loading your projects…</div></div>
  <script>
    // Read-only per-client tracker. One stable link lists every job we are filing for this
    // company. The payload is sanitized server-side (backend/src/clientPortal.ts): addresses,
    // status labels and application/permit numbers only — never correction text, never another
    // company's work, never anything internal.

    // "Filed" is the date the JURISDICTION received it, not the date we staged it. A track with no
    // filing date has not been submitted — automation never presses final submit, so a fully
    // prepared application still reads "Not filed yet" until a person files it.

    // Statuses where the CLIENT is the one who has to do something. Called out separately
    // because a tracker that shows twenty rows all saying "in progress" is a list, not a signal.
    const NEEDS_YOU = new Set(["waiting_on_designer", "ready_for_issue"]);
    const DONE = new Set(["issued", "nem_approved", "handoff_ready", "approved"]);
    const WARN = new Set(["correction_received", "correction_triaged", "qc_failed", "blocked"]);

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const when = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "—";
    const cls = (key) => NEEDS_YOU.has(key) ? "you" : DONE.has(key) ? "good" : WARN.has(key) ? "warn" : "";

    async function load() {
      const app = document.getElementById("app");
      const token = new URLSearchParams(location.search).get("token") || "";
      try {
        const res = await fetch(`/api/public/portal/${encodeURIComponent(token)}`);
        if (!res.ok) throw new Error("not found");
        const d = await res.json();
        const projects = d.projects || [];
        const yours = projects.filter((p) => NEEDS_YOU.has(p.statusKey)).length;

        const cards = projects.map((p) => {
          const tracks = (p.tracks || []).map((t) => `
            <div class="track">
              <div>
                <div>${esc(t.label)}</div>
                <div class="muted">${t.submittedAt ? "Filed " + when(t.submittedAt) : "Not filed yet"}${t.applicationNumber ? " · " + esc(t.applicationNumber) : ""}${t.confirmationNumber ? " · receipt " + esc(t.confirmationNumber) : ""}</div>
                <div class="muted">${t.permitNumber && t.permitNumber !== t.applicationNumber ? "Permit " + esc(t.permitNumber) + " · " : ""}last checked ${when(t.lastCheckedAt)}</div>
              </div>
              <span class="badge ${cls(t.outcome)}">${esc(t.statusLabel || t.outcome || "Checking…")}</span>
            </div>`).join("")
            || `<div class="track"><span class="muted">Tracking starts once the application is filed.</span></div>`;
          // The latest few updates, in the words we actually sent them. Same sentences as the
          // email for the same event — one source, two channels (backend/src/clientUpdates.ts).
          // Capped so a long-running job does not bury the current status under its own history.
          const updates = (p.updates || []).slice(0, 4).map((u) => `
            <div class="upd"><span class="when">${when(u.at)}</span>${esc(u.body)}</div>`).join("");
          return `
            <div class="card">
              <div class="row">
                <div>
                  <h2>${esc(p.address)}</h2>
                  <div class="muted">${esc(p.ahj || "")}${p.ahj && p.utility ? " · " : ""}${esc(p.utility || "")}</div>
                </div>
                <span class="badge ${cls(p.statusKey)}">${esc(p.status)}</span>
              </div>
              ${tracks}
              ${updates}
            </div>`;
        }).join("") || `<div class="card"><span class="muted">No projects yet. They appear here as soon as we open one.</span></div>`;

        app.innerHTML = `
          <div class="head">
            <h1>${esc(d.company || "Your projects")}</h1>
            <div class="muted">${projects.length} project${projects.length === 1 ? "" : "s"}${yours ? ` · ${yours} need${yours === 1 ? "s" : ""} something from you` : ""}</div>
          </div>
          ${cards}
          <footer>Updated automatically as your permits and interconnections move.<br>Bookmark this page — the link does not expire.</footer>`;
      } catch {
        app.innerHTML = `<div class="err">This tracking link isn't valid. Please contact your permitting team for a new one.</div>`;
      }
    }
    load();
  </script>
</body>
</html>
