<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Status</title>
  <style>
    /* PALETTE MATCHED BY VALUE to frontend/styles.css — not by reference.
       This page links no stylesheet on purpose (express.static sits behind
       requireAuth, so a sibling .css would bounce a logged-out client to
       /login), so these are hand-kept in step with the :root there. Same oklch
       values, same names. Font stays the system stack: this is a client-facing
       page that must render instantly with zero external requests. */
    :root {
      color-scheme: light;
      --bg:        oklch(98.5% .004 95);
      --surface:   oklch(100% 0 0);
      --surface-2: oklch(95.5% .009 180);
      --text:      oklch(20.5% .025 220);
      --muted:     oklch(52% .025 220);
      --line:      oklch(88% .012 220);
      --primary:   oklch(42% .105 173);
      --success:   oklch(50% .13 150);
      --warning:   oklch(52% .12 75);
      --danger:    oklch(57.7% .245 27.325);
      --radius-md: .45rem;
      --radius-lg: calc(.45rem + 4px);
    }
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; color: var(--text); line-height: 1.5; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    h1 { font-size: 18px; margin: 0 0 4px; }
    h2 { font-size: 14px; margin: 0 0 10px; color: var(--text); }
    .muted { color: var(--muted); font-size: 13px; }
    .track { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
    .track:first-of-type { border-top: 0; }
    .badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--primary); white-space: nowrap; }
    .badge.good { background: color-mix(in oklab, var(--success) 14%, var(--surface)); color: var(--success); }
    .badge.warn { background: color-mix(in oklab, var(--warning) 16%, var(--surface)); color: var(--warning); }
    .hist { font-size: 13px; padding: 8px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .hist:first-of-type { border-top: 0; }
    .hist .what { min-width: 0; }
    .hist .filing { font-size: 12px; color: var(--muted); }
    .hist .when { white-space: nowrap; }
    .err { text-align: center; padding: 48px 16px; color: var(--muted); }
    footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 24px; }
  </style>
</head>
<body>
  <div class="wrap" id="app"><div class="err">Loading status…</div></div>
  <script>
    // Read-only client status page. Fetches the sanitized public payload by the
    // tokenized link — address + status labels only, nothing sensitive.
    const GOOD = new Set(["issued", "nem_approved", "ready_for_issue", "approved"]);
    const WARN = new Set(["correction_flagged", "needs_human_review"]);
    const STATUS_TEXT = {
      pending: "In preparation",
      approved: "Under review by the jurisdiction",
      awaiting_human_submit: "Prepared — final submission in progress",
      submitted: "Submitted — awaiting agency review",
      ready_for_issue: "Permit ready for issue",
      issued: "Permit issued",
      nem_approved: "Interconnection approved",
      correction_received: "Correction requested — being addressed",
      correction_triaged: "Correction being addressed",
      handoff_ready: "Approved — ready for installation",
    };
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const when = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "—";
    const badge = (outcome, label) => `<span class="badge ${GOOD.has(outcome) ? "good" : WARN.has(outcome) ? "warn" : ""}">${esc(label || outcome || "Checking…")}</span>`;

    async function load() {
      const app = document.getElementById("app");
      const token = new URLSearchParams(location.search).get("token") || "";
      try {
        const res = await fetch(`/api/public/status/${encodeURIComponent(token)}`);
        if (!res.ok) throw new Error("not found");
        const d = await res.json();
        const tracks = (d.tracks || []).map((t) => `
          <div class="track">
            <div>
              <div>${esc(t.label)}</div>
              <div class="muted">${t.applicationNumber ? "Application " + esc(t.applicationNumber) + " · " : ""}${t.permitNumber ? "Permit " + esc(t.permitNumber) + " · " : ""}last checked ${when(t.lastCheckedAt)}</div>
            </div>
            ${badge(t.outcome, t.statusLabel)}
          </div>`).join("") || `<div class="muted">Tracking will appear here once the application is submitted.</div>`;
        // EVERY LINE NAMES ITS FILING. This card used to render date + status only, so a project
        // with a structural AND an electrical permit produced "Permit issued / In review / Permit
        // issued / In review…" with nothing saying which permit each line was about. The label and
        // the jurisdiction's own application number both come down in the payload now; the
        // fallbacks are there because a legacy row can be missing either one and a blank line with
        // a stray separator reads as a broken page.
        const hist = (d.history || []).map((h) => {
          const filing = [h.label, h.applicationNumber].filter(Boolean).map(esc).join(" · ");
          return `
          <div class="hist">
            <div class="what">
              <div>${esc(h.statusLabel || h.outcome)}</div>
              ${filing ? `<div class="filing">${filing}</div>` : ""}
            </div>
            <span class="muted when">${when(h.at)}</span>
          </div>`;
        }).join("") || `<div class="muted">No status changes yet.</div>`;
        app.innerHTML = `
          <div class="card">
            <h1>${esc(d.project.address || "Solar project")}</h1>
            <div class="muted">${esc(d.project.ahj || "")}${d.project.ahj && d.project.utility ? " · " : ""}${esc(d.project.utility || "")}</div>
            <p>${esc(STATUS_TEXT[d.project.status] || "In progress")}</p>
          </div>
          <div class="card"><h2>Applications</h2>${tracks}</div>
          <div class="card"><h2>Recent updates</h2>${hist}</div>
          <footer>Updated automatically. This page refreshes as your permit and interconnection move.</footer>`;
      } catch {
        app.innerHTML = `<div class="err">This status link isn't valid anymore. Please contact your permitting team for an updated link.</div>`;
      }
    }
    load();
  </script>
</body>
</html>
