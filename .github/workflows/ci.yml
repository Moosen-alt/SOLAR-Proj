# CI for every PR into main, plus ONE scheduled run on main each night. It never deploys
# (deploy.yml is manual).
#
# No run on push to main: every merge was just tested on its PR, and the post-merge run doubled
# the metered minutes without catching anything. The nightly run on main is the safety net for two
# PRs that were green alone and break together; `workflow_dispatch` runs it on demand.
#
# ONE JOB, ONE REQUIRED CHECK: "CI passed". Branch protection requires exactly that name.
#
# Why one job and not a matrix: this repository is private, so Actions minutes are metered, and
# GitHub bills each JOB separately (its own npm ci, rounded up to the minute). Speed comes from
# running suites side by side INSIDE this job (CI_TEST_CONCURRENCY), which is unbilled
# parallelism. It defaults to serial until a concurrent run is proven to match the serial one;
# serial takes about 45 minutes.
#
# Every suite runs even when an earlier one fails (continue-on-error), so one red never hides
# the others; the last step turns any red into a failed check.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables), all optional:
#   CI_RUNNER             runner label; e.g. "self-hosted" to use your own machine (free minutes)
#   CI_TEST_CONCURRENCY   suites run side by side inside the job (default 1 = serial, the proven
#                         setting; raise to 3 once a run at 3 has matched the serial results)
name: CI

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 9 * * *" # nightly on main, 09:17 UTC (3:17am Denver)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SESSION_ENCRYPTION_KEY: "ci-only-not-real-replace-in-production"
  ANTHROPIC_API_KEY: ""

jobs:
  ci:
    name: CI passed
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A PR that only touches docs, labels or the board/label workflows skips the test suites (the
      # check still reports, so it can merge). ci.yml itself is not on that list.
      - name: What changed
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # --no-renames: a moved file lists both paths, so a code file renamed into docs/ still runs the suites.
            files=$(git diff --no-renames --name-only HEAD^1 HEAD)
          else
            files="(not a PR: run everything)"
          fi
          echo "$files"
          code=true
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$files" ] && \
             ! echo "$files" | grep -qvE '^(docs/|\.github/(ISSUE_TEMPLATE/|labels\.json$|workflows/(board|labels-sync)\.yml$))|\.md$'; then
            code=false
            echo "Docs-only change: skipping the test suites."
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - if: steps.scope.outputs.code == 'true'
        run: npm ci

      - name: Typecheck
        id: typecheck
        if: steps.scope.outputs.code == 'true'
        continue-on-error: true
        run: npm run typecheck

      - name: Backend unit
        id: backend
        if: steps.scope.outputs.code == 'true'
        continue-on-error: true
        run: npm run backend:test:unit -- --concurrency ${{ vars.CI_TEST_CONCURRENCY || 1 }}

      # portal-bot's profileQueue.test.ts launches a real persistent Chromium context,
      # and a fresh runner has no browser.
      - name: Install Chromium for the portal suite
        if: steps.scope.outputs.code == 'true'
        run: npx playwright install --with-deps chromium

      - name: Portal-bot unit
        id: portal
        if: steps.scope.outputs.code == 'true'
        continue-on-error: true
        run: npm run portal:test:unit -- --concurrency ${{ vars.CI_TEST_CONCURRENCY || 1 }} --timeout 1200

      - name: Smoke (end-to-end, scratch DB)
        id: smoke
        if: steps.scope.outputs.code == 'true'
        continue-on-error: true
        run: npm run smoke

      - name: Upload test logs
        if: steps.scope.outputs.code == 'true' && (steps.typecheck.outcome == 'failure' || steps.backend.outcome == 'failure' || steps.portal.outcome == 'failure' || steps.smoke.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs
          path: .unit-test-logs/
          include-hidden-files: true
          retention-days: 7

      - name: Verdict
        if: steps.scope.outputs.code == 'true'
        run: |
          echo "typecheck=${{ steps.typecheck.outcome }} backend=${{ steps.backend.outcome }} portal=${{ steps.portal.outcome }} smoke=${{ steps.smoke.outcome }}"
          for r in "${{ steps.typecheck.outcome }}" "${{ steps.backend.outcome }}" "${{ steps.portal.outcome }}" "${{ steps.smoke.outcome }}"; do
            if [ "$r" != "success" ]; then echo "A suite ended '$r'. See its step above."; exit 1; fi
          done
          echo "Everything passed."
