# GitHub Actions — test, then deploy to Fly.io.
#
# MANUAL ONLY (Actions → Deploy → Run workflow). It used to run on every push to main, which
# meant merely CREATING a main branch — or any agent's merge — shipped to production. Per-PR
# and per-merge testing lives in ci.yml; this file only runs when a person decides to deploy.
#
# Required repository secrets:
#   FLY_API_TOKEN   — from `fly tokens create deploy`
#   (all other env vars are set as fly secrets, not here)

name: Deploy

on:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck + Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Unit suites (backend + portal-bot). Chained with && so the first failure
      # fails the job; run before smoke so a logic regression blocks deploy.
      - name: Backend unit tests
        run: npm run backend:test:unit
        env:
          SESSION_ENCRYPTION_KEY: "ci-only-not-real-replace-in-production"
          ANTHROPIC_API_KEY: ""

      - name: Portal-bot unit tests
        run: npm run portal:test:unit
        env:
          SESSION_ENCRYPTION_KEY: "ci-only-not-real-replace-in-production"
          ANTHROPIC_API_KEY: ""

      # Smoke test runs against a tmp DB — no real credentials needed.
      - name: Smoke test
        run: npm run smoke
        env:
          SESSION_ENCRYPTION_KEY: "ci-only-not-real-replace-in-production"
          ANTHROPIC_API_KEY: ""

  deploy:
    name: Deploy to Fly.io
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
