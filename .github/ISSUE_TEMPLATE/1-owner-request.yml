name: Owner request
description: Anything you want done, changed, investigated or fixed. Plain words are fine. Fable turns it into tasks.
title: "[Owner] "
labels: ["owner-request", "needs-triage"]
body:
  - type: textarea
    id: request
    attributes:
      label: What do you want?
      description: Say it however you like. Examples, screenshots, the project, portal or customer involved all help.
    validations:
      required: true
  - type: dropdown
    id: urgency
    attributes:
      label: How urgent?
      options:
        - Whenever (P3)
        - Soon (P2)
        - This week (P1)
        - Drop everything (P0)
    validations:
      required: false
