name: Feature
description: A new capability. Describe the problem first, then the proposal.
labels: ["type:feature", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is stuck or slowed down today, and why it matters.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What done looks like, in one paragraph.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Testable checks, including the regression test that proves it.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed approach (optional)
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [portal-bot, pipeline, fees, kb-lookup, intake-parser, reviewer, ahj-forms, tenancy-auth, security, ops-deploy, ci-test, frontend, docs, billing]
    validations:
      required: true
  - type: input
    id: found-by
    attributes:
      label: Filed by
      placeholder: "worker-3, fable, or leave empty if you are the owner"
